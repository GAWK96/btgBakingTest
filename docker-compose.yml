services:
  postgres:
    image: postgres:16
    container_name: btgBank-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-btgBank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-btgBankdb}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btgBank -d btgBankdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: